services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: marka
      POSTGRES_PASSWORD: marka
      POSTGRES_DB: marka
    ports:
      - "5432:5432"
    volumes:
      - marka_postgres_data:/var/lib/postgresql/data

volumes:
  marka_postgres_data:
